# =============================================================================
# GovGPT Chatbot Test Automation - CI/CD Pipeline
# =============================================================================
# This workflow:
# 1. Runs static analysis (Ruff) for code quality
# 2. Runs Behave tests with Allure formatter
# 3. Generates beautiful Allure HTML reports
# 4. Publishes reports to GitHub Pages (accessible via URL)
# 5. Keeps test history across runs for trend analysis
# =============================================================================

name: CI - GovGPT Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      tags:
        description: 'Behave tags to run (e.g., @high-risk, @LR-01)'
        required: false
        default: ''
      environment:
        description: 'Environment (staging/prod)'
        required: false
        default: 'staging'

# Required permissions for GitHub Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write

env:
  PYTHON_VERSION: '3.11'
  ALLURE_VERSION: '2.25.0'

jobs:
  # ===========================================================================
  # Job 1: Static Analysis (Ruff)
  # ===========================================================================
  lint:
    name: 🔍 Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: 🔍 Run Ruff Linter
        run: |
          echo "🔍 Running Ruff linter..."
          ruff check . --output-format=github
        continue-on-error: false

      - name: 🎨 Check Ruff Formatting
        run: |
          echo "🎨 Checking code formatting..."
          ruff format --check .
        continue-on-error: true

      - name: 📊 Generate Lint Summary
        if: always()
        run: |
          echo "## 🔍 Static Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Ruff Linter | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Format | ℹ️ Checked |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job 2: Run Tests
  # ===========================================================================
  test:
    name: 🧪 Run Tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎭 Install Playwright browsers
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: 📁 Create report directories
        run: |
          mkdir -p reports/allure-results
          mkdir -p reports/screenshots
          mkdir -p reports/allure-history

      - name: 📜 Download previous Allure history
        uses: actions/download-artifact@v4
        with:
          name: allure-history
          path: reports/allure-history
        continue-on-error: true

      - name: 🧪 Run Behave tests with Allure
        env:
          UASK_USERNAME: ${{ secrets.UASK_USERNAME }}
          UASK_PASSWORD: ${{ secrets.UASK_PASSWORD }}
          UASK_BASE_URL: ${{ secrets.UASK_BASE_URL }}
          HEADLESS_MODE: 'true'
          TAGS: ${{ github.event.inputs.tags }}
        run: |
          echo "🚀 Starting test execution..."
          
          # Build behave command
          BEHAVE_CMD="behave -f allure_behave.formatter:AllureFormatter -o reports/allure-results --no-capture"
          
          # Add tags if specified
          if [ -n "$TAGS" ]; then
            BEHAVE_CMD="$BEHAVE_CMD --tags $TAGS"
          fi
          
          echo "📋 Running: $BEHAVE_CMD"
          
          # Run tests (don't fail workflow on test failures)
          $BEHAVE_CMD || true
          
          echo "✅ Test execution completed"

      - name: ☕ Install Java (required for Allure)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📊 Install Allure CLI
        run: |
          echo "📥 Downloading Allure ${{ env.ALLURE_VERSION }}..."
          curl -sLo allure.tgz "https://github.com/allure-framework/allure2/releases/download/${{ env.ALLURE_VERSION }}/allure-${{ env.ALLURE_VERSION }}.tgz"
          tar -xzf allure.tgz
          sudo mv allure-${{ env.ALLURE_VERSION }} /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure
          allure --version

      - name: 📈 Copy history from previous runs
        run: |
          if [ -d "reports/allure-history" ] && [ "$(ls -A reports/allure-history 2>/dev/null)" ]; then
            echo "📜 Found previous history, copying..."
            cp -r reports/allure-history/* reports/allure-results/ 2>/dev/null || true
          else
            echo "ℹ️ No previous history found"
          fi

      - name: 🎨 Generate Allure HTML Report
        run: |
          echo "🎨 Generating Allure report..."
          allure generate reports/allure-results -o reports/allure-report --clean
          echo "✅ Report generated successfully!"
          
          # Show summary
          echo ""
          echo "📊 Report Summary:"
          ls -la reports/allure-report/ | head -10

      - name: 💾 Save Allure history
        run: |
          mkdir -p reports/allure-history
          if [ -d "reports/allure-report/history" ]; then
            cp -r reports/allure-report/history/* reports/allure-history/ 2>/dev/null || true
            echo "📜 History saved for next run"
          fi

      - name: 📤 Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: reports/allure-results
          retention-days: 30

      - name: 📤 Upload Allure history
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-history
          path: reports/allure-history
          retention-days: 90

      - name: 📤 Upload Allure HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: reports/allure-report
          retention-days: 30

      - name: 📤 Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: reports/screenshots
          retention-days: 14

  # ===========================================================================
  # Job 2: Publish to GitHub Pages
  # ===========================================================================
  publish:
    name: 📚 Publish Allure Report
    needs: test
    runs-on: ubuntu-latest
    if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download Allure report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: 📄 Create index redirect
        run: |
          # Create a nice landing page
          cat > allure-report/README.md << 'EOF'
          # 📊 GovGPT Test Automation - Allure Report
          
          This report is automatically generated from the latest test run.
          
          ## 🔗 View Report
          
          Open `index.html` in this directory to view the full report.
          
          ## 📋 Test Categories
          
          - **High Risk** (@high-risk): Security and safety tests
          - **Medium Risk** (@medium-risk): Functionality tests  
          - **Low Risk** (@low-risk): General information tests
          
          ---
          *Generated on: $(date)*
          EOF

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: '📊 Update Allure Report - ${{ github.sha }}'

      - name: 📢 Report URL
        run: |
          echo ""
          echo "=============================================="
          echo "📊 ALLURE REPORT PUBLISHED!"
          echo "=============================================="
          echo ""
          echo "🔗 View your report at:"
          echo "   https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo ""
          echo "=============================================="

  # ===========================================================================
  # Job 3: Notification Summary
  # ===========================================================================
  notify:
    name: 📢 Test Summary
    needs: [test, publish]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: 📥 Download test results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results
        continue-on-error: true

      - name: 📊 Generate Summary
        run: |
          echo "# 🧪 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Count results
          PASSED=$(find allure-results -name "*-result.json" -exec grep -l '"status":"passed"' {} \; 2>/dev/null | wc -l || echo 0)
          FAILED=$(find allure-results -name "*-result.json" -exec grep -l '"status":"failed"' {} \; 2>/dev/null | wc -l || echo 0)
          BROKEN=$(find allure-results -name "*-result.json" -exec grep -l '"status":"broken"' {} \; 2>/dev/null | wc -l || echo 0)
          
          TOTAL=$((PASSED + FAILED + BROKEN))
          
          echo "| Status | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚠️ Broken | $BROKEN |" >> $GITHUB_STEP_SUMMARY
          echo "| 📊 Total | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## 🔗 Links" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 [Allure Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 [Download Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Run ID: ${{ github.run_id }} | Commit: ${{ github.sha }}*" >> $GITHUB_STEP_SUMMARY

