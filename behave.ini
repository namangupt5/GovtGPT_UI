# Behave Configuration

[behave]
# Use both pretty formatter for console output and allure for results
format = pretty
         allure_behave.formatter:AllureFormatter
outfiles = stdout
           reports/allure-results
show_skipped = false
show_timings = true
junit = false
junit_directory = reports/junit
stdout_capture = false
stderr_capture = false
log_capture = true

[behave.formatters]
allure = allure_behave.formatter:AllureFormatter

[behave.userdata]
# Default configuration
browser = chromium
headless = false
slow_mo = 100

# CI/CD Profile - headless mode
[behave.userdata.ci]
browser = chromium
headless = true
slow_mo = 0

# Debug Profile - headed with slow motion
[behave.userdata.debug]
browser = chromium
headless = false
slow_mo = 500

