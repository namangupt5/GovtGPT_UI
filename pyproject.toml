[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uask-automation"
version = "1.0.0"
description = "AI-powered UI automation framework for U-Ask UAE Government Chatbot"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "QA Automation Team", email = "qa@dge.gov.ae"}
]
keywords = ["automation", "testing", "chatbot", "ai", "playwright", "cucumber"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "isort",
    "mypy",
    "pre-commit",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | reports
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".git", ".venv", "reports"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --alluredir=reports/allure-results"
markers = [
    "smoke: Quick smoke tests",
    "regression: Full regression tests",
    "security: Security validation tests",
    "multilang: Multi-language tests",
    "multiturn: Multi-turn conversation tests",
]

