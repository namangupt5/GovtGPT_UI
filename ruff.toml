# =============================================================================
# Ruff Configuration - Fast Python Linter & Formatter
# https://docs.astral.sh/ruff/
# =============================================================================

# Target Python version
target-version = "py311"

# Line length
line-length = 120

# Exclude directories
exclude = [
    ".venv",
    "venv",
    "__pycache__",
    ".git",
    "build",
    "dist",
    "*.egg-info",
    ".eggs",
    "reports",
    "logs",
]

[lint]
# Enable these rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "S",      # flake8-bandit (security)
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",   # Line too long (handled by formatter)
    "E722",   # Bare except (OK for graceful error handling)
    "F841",   # Local variable assigned but never used (some OK)
    "C401",   # Unnecessary generator (style preference)
    "S101",   # Use of assert (OK in tests)
    "S105",   # Hardcoded password (false positives in test data)
    "S106",   # Hardcoded password (false positives in test data)
    "S110",   # Try-except-pass (OK for graceful fallbacks)
    "S112",   # Try-except-continue (OK for graceful fallbacks)
    "S311",   # Random not for crypto (OK for tests)
    "S603",   # Subprocess call (OK for test runner)
    "B008",   # Function call in default argument (OK for behave)
    "B011",   # Do not assert False (OK in behave steps)
    "B007",   # Loop control variable not used (OK)
    "UP007",  # Use X | Y for union types (compatibility)
    "UP015",  # Unnecessary mode argument (explicit is fine)
    "SIM102", # Nested if statements (readability preference)
    "SIM105", # Use contextlib.suppress (preference)
    "SIM108", # Ternary operator (readability preference)
    "SIM110", # Use any() instead of for loop (readability preference)
    "RUF001", # Ambiguous unicode (OK for Arabic support)
    "RUF002", # Ambiguous unicode (OK for Arabic support)
    "RUF003", # Ambiguous unicode (OK for Arabic support)
    "RUF012", # Mutable class attribute (singleton pattern)
    "RUF013", # Implicit Optional (legacy code compatibility)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[lint.per-file-ignores]
# Tests can use assert and have different requirements
"features/steps/*.py" = ["S101", "B017"]
"validators/*.py" = ["S101"]
"*_test.py" = ["S101"]
"test_*.py" = ["S101"]

[lint.isort]
# Import sorting configuration
known-first-party = ["pages", "validators", "utils", "features"]
force-single-line = false
combine-as-imports = true

[format]
# Formatter configuration
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

